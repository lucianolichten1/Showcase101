<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Finance OS — Admin</title>
<link rel="preconnect" href="https://api.fontshare.com" />
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="admin.css" />
<style>
  html, body { margin: 0; height: 100%; background: var(--bg); }
  #root, .afo.shell { height: 100%; }
  .main-scroll { min-height: 100%; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script type="text/babel" src="AppShell.jsx"></script>
<script type="text/babel" src="ListView.jsx"></script>
<script type="text/babel" src="DetailView.jsx"></script>
<script type="text/babel" src="AddCompanyModal.jsx"></script>

<script type="text/babel">
function App() {
  const [route, setRoute] = React.useState({ view: "list", id: null });
  const [companies, setCompanies] = React.useState(window.AFO.COMPANIES);
  const [modal, setModal] = React.useState(false);
  const [added, setAdded] = React.useState(null);
  const [toast, setToast] = React.useState(null);

  React.useEffect(() => {
    const el = document.getElementById("mainscroll");
    if (el) el.scrollTo({ top: 0 });
  }, [route]);

  const open = (id) => setRoute({ view: "detail", id });
  const home = () => setRoute({ view: "list", id: null });

  function createCompany(c) {
    window.AFO.COMPANIES = [c, ...window.AFO.COMPANIES];
    setCompanies(window.AFO.COMPANIES);
    setModal(false);
    setRoute({ view: "list", id: null });
    setAdded(c.id);
    setToast(`${c.name} added`);
    setTimeout(() => setAdded(null), 1800);
    setTimeout(() => setToast(null), 2600);
  }

  return (
    <React.Fragment>
      <AppShell onHome={home}>
        {route.view === "list"
          ? <ListView companies={companies} onOpen={open} onAdd={() => setModal(true)} justAddedId={added} />
          : <DetailView id={route.id} onBack={home} />}
      </AppShell>
      {modal && <AddCompanyModal onClose={() => setModal(false)} onCreate={createCompany} />}
      {toast && <div className="toast"><ShIcon html={window.AFO.I.check("#7fe0a8", 16)} /> {toast}</div>}
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
